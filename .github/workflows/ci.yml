name: Revisión del sitio (CI)

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Verificar que existan los archivos del sitio
        run: |
          test -f public/index.html
          test -f public/styles.css

      - name: Verificar el idioma y el título de la página
        run: |
          grep -q '<html lang="es">' public/index.html
          grep -q '<title>' public/index.html
          echo "Revisión básica superada"
